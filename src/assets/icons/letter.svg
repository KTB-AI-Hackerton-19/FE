<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- 하트로 봉한 편지. 봉투 안쪽은 mask 로 뚫어 배경색이 그대로 비친다. -->
  <mask id="letter-face">
    <rect width="24" height="24" fill="white"/>
    <!-- 접힌 자국 — 봉투 위쪽에서 가운데로 모인다 -->
    <g stroke="black" stroke-width="1.2" stroke-linecap="round" fill="none">
      <path d="M3.6 7.6 12 13.4"/>
      <path d="M20.4 7.6 12 13.4"/>
    </g>
    <!-- 봉인 하트 자리 — 하트가 겹치는 곳을 비워 테두리처럼 보이게 한다 -->
    <circle cx="12" cy="14.6" r="3.5" fill="black"/>
  </mask>

  <g fill="currentColor">
    <rect x="2.4" y="5.4" width="19.2" height="14.4" rx="2.6" mask="url(#letter-face)"/>
    <!-- 봉인 하트 -->
    <path d="M12 17.6c-2.1-1.5-3.3-2.6-3.3-3.9a1.7 1.7 0 0 1 3.3-.7 1.7 1.7 0 0 1 3.3.7c0 1.3-1.2 2.4-3.3 3.9Z"/>
  </g>
</svg>
