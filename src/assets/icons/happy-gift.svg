<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- 웃는 표정의 선물상자. 얼굴은 mask 로 뚫어 배경색이 그대로 비친다. -->
  <mask id="happy-gift-face">
    <rect width="24" height="24" fill="white"/>
    <g stroke="black" stroke-linecap="round" fill="none">
      <!-- 웃는 입. 눈썹 없이 눈과 입만 두고 얼굴을 조금 위로 올렸다 -->
      <path d="M10.4 17.5Q12 19.3 13.6 17.5" stroke-width="1.05"/>
    </g>
    <circle cx="9.7" cy="14.6" r="1.1" fill="black"/>
    <circle cx="14.3" cy="14.6" r="1.1" fill="black"/>
  </mask>

  <g mask="url(#happy-gift-face)" fill="currentColor">
    <!-- 리본 — 매듭으로 두 고리를 이어 준다 -->
    <ellipse cx="9.5" cy="4.2" rx="2.4" ry="1.8"/>
    <ellipse cx="14.5" cy="4.2" rx="2.4" ry="1.8"/>
    <rect x="10.8" y="3.2" width="2.4" height="3.4" rx="1"/>
    <!-- 뚜껑 -->
    <rect x="2.4" y="5.7" width="19.2" height="4.4" rx="1.4"/>
    <!-- 몸통 -->
    <path d="M3.4 11.1h17.2l-1.15 8.35A3.2 3.2 0 0 1 16.3 22.4H7.7a3.2 3.2 0 0 1-3.15-2.95L3.4 11.1Z"/>
  </g>
</svg>
