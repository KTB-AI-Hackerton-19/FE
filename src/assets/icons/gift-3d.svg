<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!--
    입체감을 준 선물상자. 장식용이라 브랜드 색을 그대로 박아 둔다 (currentColor 아님).
    윗면을 사다리꼴로 눕혀 깊이를 만들고, 면마다 명암을 달리해 세워 보이게 한다.
  -->
  <defs>
    <linearGradient id="gift3d-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4917c"/>
      <stop offset="1" stop-color="#dd6a53"/>
    </linearGradient>
    <linearGradient id="gift3d-lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbb3a1"/>
      <stop offset="1" stop-color="#ef8a73"/>
    </linearGradient>
  </defs>

  <!-- 바닥 그림자 — 떠 있지 않고 놓여 있게 -->
  <ellipse cx="60" cy="105" rx="34" ry="6" fill="#d98a76" opacity="0.18"/>

  <!-- 몸통 -->
  <rect x="24" y="52" width="72" height="50" rx="7" fill="url(#gift3d-body)"/>
  <!-- 오른쪽 면 — 한 톤 어둡게 눕혀 두께를 만든다 -->
  <path d="M96 52v50a7 7 0 0 1-7 7h-6V45h6a7 7 0 0 1 7 7Z" fill="#c85c47" opacity="0.35"/>

  <!-- 뚜껑 — 앞으로 살짝 기울여 윗면이 보이게 -->
  <path d="M18 44h84a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H18a4 4 0 0 1-4-4V48a4 4 0 0 1 4-4Z" fill="url(#gift3d-lid)"/>
  <path d="M22 38h76l4 6H18l4-6Z" fill="#fdc8b9"/>

  <!-- 리본 — 뚜껑과 몸통을 가로지른다 -->
  <rect x="52" y="38" width="16" height="64" fill="#fff" opacity="0.72"/>

  <!-- 매듭 -->
  <ellipse cx="45" cy="30" rx="13" ry="10" fill="#fdc8b9"/>
  <ellipse cx="75" cy="30" rx="13" ry="10" fill="#fdc8b9"/>
  <ellipse cx="45" cy="30" rx="5.5" ry="4" fill="#f19b86"/>
  <ellipse cx="75" cy="30" rx="5.5" ry="4" fill="#f19b86"/>
  <rect x="53" y="26" width="14" height="14" rx="5" fill="#fff" opacity="0.9"/>
</svg>
